apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jtk-ops-hub-v2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Deel-Playground/jtk-ops-hub-v2
    targetRevision: main
    path: helm
    helm:
      releaseName: jtk-ops-hub-v2
      valueFiles:
        - ../values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: jtk-ops-hub-v2
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true