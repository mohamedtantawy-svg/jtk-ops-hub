{{- if .Values.handovers.cronEnabled }}
# ── Handover cron jobs (Phase 4) ────────────────────────────────────────
# Two CronJobs that curl the Phase 4 handover endpoints every 15 minutes:
#   • lifecycle — flips approved → active, approved/active → expired
#   • reminders — 48h / 24h / handback notifications
#
# Both authenticate via CRON_SECRET, sourced from the same external
# secret that backs the app deployment. The cron-runner image is the
# stock curl Alpine — small footprint, baked-in image, no app rebuild
# required when the cron logic changes.
#
# Toggle the whole stack with `handovers.cronEnabled` in values.yaml so a
# misconfigured environment (missing CRON_SECRET) doesn't fire empty
# 403s every 15 minutes.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.sandboxName }}-handovers-lifecycle
  namespace: {{ .Values.sandboxName }}
  labels:
    app.kubernetes.io/name: {{ .Values.sandboxName }}-handovers-lifecycle
    app.kubernetes.io/component: handovers-cron
    sandbox.deel/name: {{ .Values.sandboxName }}
spec:
  schedule: {{ .Values.handovers.lifecycleSchedule | default "*/15 * * * *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.10.1
              imagePullPolicy: IfNotPresent
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.sandboxName }}-secret
                      key: CRON_SECRET
              command: ["sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  url="http://{{ .Values.sandboxName }}-app.{{ .Values.sandboxName }}.svc.cluster.local/api/v1/handovers/cron/lifecycle"
                  echo "[handovers-cron] POST ${url}"
                  curl -fsS -X POST \
                    -H "Authorization: Bearer ${CRON_SECRET}" \
                    -H "Content-Type: application/json" \
                    --max-time 60 \
                    "${url}" || exit_code=$?
                  exit ${exit_code:-0}
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.sandboxName }}-handovers-reminders
  namespace: {{ .Values.sandboxName }}
  labels:
    app.kubernetes.io/name: {{ .Values.sandboxName }}-handovers-reminders
    app.kubernetes.io/component: handovers-cron
    sandbox.deel/name: {{ .Values.sandboxName }}
spec:
  schedule: {{ .Values.handovers.remindersSchedule | default "*/15 * * * *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.10.1
              imagePullPolicy: IfNotPresent
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.sandboxName }}-secret
                      key: CRON_SECRET
              command: ["sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  url="http://{{ .Values.sandboxName }}-app.{{ .Values.sandboxName }}.svc.cluster.local/api/v1/handovers/cron/reminders"
                  echo "[handovers-cron] POST ${url}"
                  curl -fsS -X POST \
                    -H "Authorization: Bearer ${CRON_SECRET}" \
