{{- if .Values.serviceAccount.create }}
# Reference the canonical release name (sandboxName), matching what
# deployment.yaml's `serviceAccountName: {{ .Values.sandboxName }}` and
# postgres.yaml expect. The earlier `.Values.serviceAccountName` lookup
# resolved to empty string (no such top-level key in values.yaml) which
# rendered `metadata.name: ""` and broke the ArgoCD dry-run validation
# (k8s rejects ServiceAccount with empty .metadata.name).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.sandboxName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
    release: {{ .Release.Name }}
{{- if .Values.s3.enabled }}
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::{{ .Values.s3.accountId }}:role/{{ .Values.sandboxName }}-s3-role"
    eks.amazonaws.com/sts-regional-endpoints: "true"
{{- end }}
{{- end }}
