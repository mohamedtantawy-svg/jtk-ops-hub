apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
    release: {{ .Release.Name }}
{{- if .Values.s3.enabled }}
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::{{ .Values.s3.accountId }}:role/{{ .Values.sandboxName }}-s3-role"
    eks.amazonaws.com/sts-regional-endpoints: "true"
{{- end }}
