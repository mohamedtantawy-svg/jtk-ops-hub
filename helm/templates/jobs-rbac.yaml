{{- if .Values.jobsRbac.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.jobsRbac.roleName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
    release: {{ .Release.Name }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.jobsRbac.bindingName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
    release: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    # Match the SA created in service-account.yaml (sandboxName-keyed).
    # Old `.Values.serviceAccountName` resolved to empty; harmless while
    # jobsRbac.enabled is false but would silently bind to the empty SA
    # if anyone flips the flag without auditing this file.
    name: {{ .Values.sandboxName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Values.jobsRbac.roleName }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
