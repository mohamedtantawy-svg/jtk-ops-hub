{{- if .Values.database.enabled -}}
# Dedicated StorageClass for the CNPG cluster's PVCs with reclaimPolicy: Retain.
#
# Why this exists: the EKS default storage class typically has reclaimPolicy:
# Delete, which means deleting a PVC also deletes the underlying EBS volume.
# Combined with a CNPG Cluster resource being deleted (e.g. via a
# database.enabled: false toggle, or an accidental Helm uninstall), this is
# the chain that causes irreversible data wipe.
#
# With Retain: deleting a PVC leaves the PV in Released state and the EBS
# volume alive. Recovery is "create a new PVC pointing at the same volume"
# instead of "restore from S3 backup".
#
# Resource policy "keep" prevents Helm from deleting this StorageClass on
# `helm uninstall` — keeps the safety net even if the chart goes away.
#
# OPT-IN: this StorageClass is created on every deploy but is NOT
# referenced by helm/templates/postgres.yaml (which leaves storageClass
# logic untouched to avoid disrupting the running CNPG Cluster — CNPG
# treats spec.storage.storageClass as immutable and a wrong reconcile
# could break the live DB).
#
# To start using it: set `database.storage.storageClass: <sandboxName>-pg-retain`
# in helm/values.yaml — this should be done in a follow-up PR when the
# cluster is in a state that allows the change (e.g. after a fresh
# bootstrap, or alongside a planned recreate).
#
# To convert the EXISTING PV (the live cluster's volume) to retain policy
# without recreating the cluster, patch the PV directly:
#   kubectl patch pv <pv-name> -p '{"spec":{"persistentVolumeReclaimPolicy":"Retain"}}'
# This is a one-line operation and doesn't disrupt CNPG.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.sandboxName }}-pg-retain
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app.kubernetes.io/name: {{ .Values.sandboxName }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    sandbox.deel/name: {{ .Values.sandboxName }}
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
{{- end }}
