sandboxName: "my-sandbox"

app:
  image:
    repository: nginx
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
  env: []
podAnnotations: {}
database:
  enabled: false
  instances: 1
  postgresVersion: "16"
  pgadmin:
    email: "admin@deel.tools"
  storage:
    size: "8Gi"
  bootstrapDatabase: "app"
  bootstrapOwner: "app"
  nodeSelector:
    karpenter.sh/nodepool: playgrounds-v1
  tolerations:
    - key: playgrounds-v1
      operator: Equal
      value: "true"
      effect: NoSchedule
ingress:
  enabled: true
  ingressClassName: internal-nginx
  host: ""
  path: "/"
  pathType: Prefix
  annotations: {}
  tls: []

publicIngress:
  enabled: false

argocd:
  enabled: false
  namespace: "argocd"
  project: "default"
  repoURL: ""
  targetRevision: "main"
  path: "."
  helm:
    valueFiles: []
    values: ""
  autoSync:
    enabled: true
    prune: true
    selfHeal: true
    allowEmpty: false

service:
  port: 80

externalSecret:
  refreshInterval: 1h

nodeSelector:
  karpenter.sh/nodepool: playgrounds-v1
tolerations:
  - key: playgrounds-v1
    operator: Equal
    value: "true"
    effect: NoSchedule

s3:
  enabled: true
  bucket: "deel-playgrounds-data"
  accountId: "211125331032"
  oidcIssuer: "oidc.eks.eu-west-1.amazonaws.com/id/6D88D8938454CA111E105EEC1A1D5630"
