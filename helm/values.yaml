sandboxName: "my-sandbox"

app:
  image:
    repository: nginx
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
  env: []
podAnnotations: {}
database:
  enabled: true
  # Bumped to 2 on 2026-05-06: was 1 (single instance, no replica). Now
  # primary + 1 hot standby, so a single-pod failure or node drain doesn't
  # take the DB down. Adds a second copy of the data on a separate node
  # (CNPG default anti-affinity) and gives us a read-replica for free.
  instances: 2
  postgresVersion: "16"
  backup: true
  # Backup retention on the barman-cloud ObjectStore. "90d" keeps base
  # backups + WAL for 90 days, then prunes older. Set to "" to retain
  # forever (unbounded S3 cost). Added 2026-05-06.
  backupRetention: "90d"
  recovery:
    enabled: false
    source: ""
  pgadmin:
    email: "admin@deel.tools"
  storage:
    size: "8Gi"
    # OPT-IN: a Retain-policy StorageClass is created at deploy time —
    # see helm/templates/storageclass.yaml. To use it for new PVCs (e.g.
    # for replicas added by bumping `instances`, or for a fresh cluster
    # after a recreate), set:
    #     storageClass: jtk-ops-hub-v2-pg-retain
    # Doing this on an EXISTING cluster won't help — CNPG treats
    # spec.storage.storageClass as immutable. The setting only affects
    # NEW PVCs going forward. To convert an EXISTING PV to retain policy,
    # patch the PV directly:
    #     kubectl patch pv <pv-name> \
    #       -p '{"spec":{"persistentVolumeReclaimPolicy":"Retain"}}'
    # storageClass: ""
  bootstrapDatabase: "app"
  bootstrapOwner: "app"
  nodeSelector:
    karpenter.sh/nodepool: playgrounds-v1
  tolerations:
    - key: playgrounds-v1
      operator: Equal
      value: "true"
      effect: NoSchedule
redis:
  enabled: false
  version: "7.4-alpine"
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
  nodeSelector:
    karpenter.sh/nodepool: playgrounds-v1
ingress:
  enabled: true
  ingressClassName: internal-nginx
  host: ""
  path: "/"
  pathType: Prefix
  annotations: {}
  tls: []
  aliasHost: ""


publicIngress:
  enabled: false
  host: ""
  whitelistSourceRange: ""

service:
  port: 80

externalSecret:
  refreshInterval: 1h
  storeKind: ClusterSecretStore
  storeName: aws-secrets-manager
  secretPath: ""

nodeSelector:
  karpenter.sh/nodepool: playgrounds-v1
tolerations:
  - key: playgrounds-v1
    operator: Equal
    value: "true"
    effect: NoSchedule

s3:
  enabled: true
  bucket: "deel-playgrounds-data"
  accountId: "211125331032"
  oidcIssuer: "oidc.eks.eu-west-1.amazonaws.com/id/6D88D8938454CA111E105EEC1A1D5630"
