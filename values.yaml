app:
  replicas: 1
  port: 3000
  image:
    repository: 211125331032.dkr.ecr.eu-west-1.amazonaws.com/jtk-ops-hub-v2
    tag: 2cc3919cf573255ad0477485e1bbc49e7a1c17e8
    pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  host: jtk-ops-hub-v2.dp.com
  aliasHost: jtk.dp.com

sandboxName: jtk-ops-hub-v2

# Top-level key required by helm/templates/service-account.yaml (the legacy,
# Nexus-canonical SA template). PR #500 tried to delete that template since
# helm/templates/serviceaccount.yaml (no hyphen) handles SA creation
# correctly under the s3.enabled gate — but the Nexus "sync templates to v16
# with overrides" bot recreates the deleted file every cycle, taking ArgoCD
# back into a `metadata.name: ""` dry-run failure (commit a8c36c8 was the
# revert). Adding this key here makes the canonical template render with a
# valid name even after the bot re-introduces the file. Match sandboxName
# exactly so the SA name is stable across deploys.
serviceAccountName: jtk-ops-hub-v2

database:
  enabled: true

resources:
  # Bumped 2026-05-04: 512Mi was tight enough that the workbench (5,000-
  # task scan) + offboarding (2,651-task scan) jobs running on a 5 min
  # cadence pushed memory past the limit roughly every hour, which
  # surfaced as OOM-killed pod restarts (the "app keeps crashing every
  # hour" symptom). Raising the limit to 1Gi gives the cache + scan
  # working set ~3x headroom; cpu request bumped slightly so the runtime
  # doesn't get throttled while cleaning up after a scan.
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: false
  name: jtk-ops-hub-v2
  annotations: {}


externalSecret:
  storeKind: ClusterSecretStore
  storeName: aws-secrets-manager
  secretPath: jtk-ops-hub-v2
  refreshInterval: 5m

s3:
  enabled: false

publicIngress:
  enabled: false

redis:
  enabled: false

jobsRbac:
  enabled: false

# ── Handover cron (Phase 4 of HANDOVERS_PLAN.md) ────────────────────────
# Two CronJobs that hit /api/v1/handovers/cron/{lifecycle,reminders}
# every 15 minutes. Disabled by default until CRON_SECRET is provisioned
# in the external secret store; flip cronEnabled to true once it is.
handovers:
  cronEnabled: false
  lifecycleSchedule: "*/15 * * * *"
  remindersSchedule: "*/15 * * * *"
