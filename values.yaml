app:
  replicas: 1
  port: 3000
  image:
    repository: 211125331032.dkr.ecr.eu-west-1.amazonaws.com/jtk-ops-hub-v2
    tag: 4ecf7084e755d1738b8f1e9917879c3fb81165ca
    pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  host: jtk-ops-hub-v2.dp.com
  aliasHost: jtk.dp.com

sandboxName: jtk-ops-hub-v2

database:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  name: ""
  annotations: {}


externalSecret:
  storeKind: ClusterSecretStore
  storeName: aws-secrets-manager
  secretPath: jtk-ops-hub-v2
  refreshInterval: 5m

s3:
  enabled: false

publicIngress:
  enabled: false

redis:
  enabled: false

jobsRbac:
  enabled: false
